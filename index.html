<html lang="en"><head><meta charset="utf-8">

<!--

create table library(user_id uuid primary key references auth.users, data jsonb not null default '{}');
alter table library enable row level security;
create policy own on library for all using (auth.uid()=user_id) with check (auth.uid()=user_id);
insert into storage.buckets(id,name,public) values('music','music',false);
create policy ownfiles on storage.objects for all
 using (bucket_id='music' and (storage.foldername(name))[1]=auth.uid()::text)

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--c:#a9d9b5;--t:#2a2a2a;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}body{position:fixed;inset:0;width:100%;touch-action:pan-y}
body{background:var(--c);color:var(--t);font:16px -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;display:flex;flex-direction:column;height:auto;overflow:hidden;transition:background .6s}
#view.fix{overflow:hidden}
#view{flex:1;overflow:auto;overflow-x:hidden;overscroll-behavior:none;padding:env(safe-area-inset-top) 18px 12px;-webkit-overflow-scrolling:touch}
nav{display:flex;justify-content:center;gap:6px;padding:6px 12px calc(6px + env(safe-area-inset-bottom));background:none}
nav button{flex:1;max-width:160px;border:0;background:none;font:600 12px inherit;color:var(--t);opacity:.55;padding:8px;border-radius:12px}
nav button.a{opacity:1;background:rgba(0,0,0,.12)}
button{font-family:inherit;cursor:pointer;color:inherit}
.pill{border:0;border-radius:30px;background:linear-gradient(#3a3a3a,#1b1b1b);color:#eee;height:46px;min-width:92px;box-shadow:0 6px 12px rgba(0,0,0,.3),inset 0 1px 1px rgba(255,255,255,.15);font-weight:700;display:flex;align-items:center;justify-content:center}
.pill:active{transform:translateY(2px);box-shadow:0 2px 5px rgba(0,0,0,.3)}.pill.sm{height:36px;padding:0 16px;font-size:13px;min-width:0}
.k{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;letter-spacing:1px}
.pl{max-width:1000px;margin:0 auto;padding-top:3vh;height:100%;display:flex;flex-direction:column;align-items:center}.bot{align-self:stretch;margin-top:auto;padding-bottom:1vh}
.stagew{flex:1;min-height:0;align-self:stretch;container-type:size;display:flex;justify-content:center;align-items:center;padding-right:10vw;margin-bottom:2vh}
.stage{position:relative;width:min(76vw,44dvh,520px);height:min(76vw,44dvh,520px);width:min(96cqw,98cqh);height:min(96cqw,98cqh)}
.stage .arm{position:absolute;left:68%;top:-4%;width:28%;height:84%;transform-origin:80% 6.67%;transform:rotate(-24deg);transition:transform 1s cubic-bezier(.5,0,.2,1);pointer-events:none;filter:drop-shadow(4px 8px 6px rgba(0,0,0,.35))}
.stage .arm.on{transform:rotate(1deg)}
.disc{border-radius:50%;aspect-ratio:1;position:relative;background:radial-gradient(circle,transparent 0 33%,#000 34% 36%,transparent 37%),repeating-radial-gradient(circle,#0b0b0b 0 2px,#1a1a1a 3px 4px);box-shadow:0 14px 28px rgba(0,0,0,.4);animation:sp 5s linear infinite paused;display:grid;place-items:center}
.disc.on{animation-play-state:running}
.disc:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(255,255,255,.1),transparent 25%,rgba(255,255,255,.08) 50%,transparent 75%,rgba(255,255,255,.1))}
.disc i{width:46%;aspect-ratio:1;border-radius:50%;background:#bbb center/cover;z-index:1;box-shadow:0 0 0 5px #000}
.disc i:before{content:"";position:absolute;left:50%;top:50%;width:6%;aspect-ratio:1;background:var(--c);border-radius:50%;transform:translate(-50%,-50%);display:none}
.stage>.disc{width:100%}
@keyframes sp{to{transform:rotate(360deg)}}
.info{align-self:stretch}.info h1{margin:0;font-size:clamp(22px,6vw,34px);letter-spacing:.5px;text-transform:uppercase}.info p{margin:4px 0 0;opacity:.75;font-size:18px}
.row{display:flex;align-items:center;gap:10px;align-self:stretch;margin-top:3vh;font-size:12px}
input[type=range]{flex:1;accent-color:#222;height:24px}
.ctl{display:flex;justify-content:space-between;align-self:stretch;margin:3vh 0 6px}
.tabs{display:flex;gap:8px;align-items:center;margin:16px 0}.tabs button:not(.pill){border:0;background:none;font:800 24px inherit;opacity:.4;padding:0 8px 0 0}.tabs button.a{opacity:1}.sp{flex:1}
.shelf{margin-bottom:26px}.shelf .row{display:flex;align-items:flex-end;gap:14px;min-height:150px;margin:0;padding:0 8px}
.board{height:16px;border-radius:3px;background:linear-gradient(#a8703a,#7a4a22);box-shadow:0 10px 14px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.25)}
.sl{flex:1;max-width:170px;position:relative;cursor:pointer;padding-top:14px;transition:transform .2s}.sl:hover{transform:translateY(-6px)}
.pk{position:absolute;top:0;left:6%;width:88%;aspect-ratio:1;border-radius:50%;background:#111;box-shadow:inset 0 0 0 6px #222}
.cv{position:relative;aspect-ratio:1;border-radius:4px 4px 2px 2px;background:#2b2b2b center/cover;display:grid;place-items:center;font-size:32px;color:#ffffff88;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.sl span{display:block;font-size:12px;font-weight:700;text-align:center;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:26px 14px;padding:34px 0 20px}
figure{margin:0;position:relative;text-align:center;animation:fl 4s ease-in-out infinite;animation-delay:var(--d)}
figure .dw{cursor:pointer}figure .disc{animation:none;width:100%}
figure:after{content:"";display:block;width:60%;height:10px;margin:14px auto 0;border-radius:50%;background:rgba(0,0,0,.25);filter:blur(6px)}
figcaption{font-size:13px;font-weight:700;margin-top:8px}figcaption small{display:block;font-weight:400;opacity:.7}
@keyframes fl{50%{transform:translateY(-10px)}}
.dots{position:absolute;right:2px;top:2px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.12);color:#fff;opacity:.55;font-size:14px;line-height:1;z-index:3}
.in{width:100%;padding:13px 14px;border:0;border-radius:14px;background:rgba(255,255,255,.55);font:16px inherit;margin:6px 0;color:#222}
.card{background:rgba(255,255,255,.35);border-radius:20px;padding:16px;margin-bottom:14px}
.card label{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-weight:600}
.mod{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:#fff;color:#222;width:min(100%,460px);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;max-height:80dvh;overflow:auto}
.sheet button{border:0;background:#f2f2f2;border-radius:12px;padding:14px;font:600 16px inherit;text-align:left}.sheet .dng{color:#d22}
.auth{max-width:380px;margin:0 auto;padding-top:8vh;text-align:center}.auth img{width:96px;border-radius:22px;box-shadow:0 10px 24px #0005}.auth h1{margin:10px 0 18px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:20;opacity:0;transition:.3s;pointer-events:none}#toast.s{opacity:1}
.av{width:84px;height:84px;border-radius:50%;background:#222 center/cover;color:#fff;display:grid;place-items:center;font-size:34px;font-weight:800;cursor:pointer}
.empty{opacity:.7;text-align:center;padding:40px 10px}
@media(min-width:900px){#view{padding-left:40px;padding-right:40px}.stagew{padding-right:5vw}}
@media(min-width:700px) and (min-height:700px){.ctl{justify-content:flex-end;gap:14px}}
@media(min-width:700px) and (min-height:600px) and (orientation:landscape){
.pl{flex-direction:row;align-items:center;max-width:none;width:100%;padding:2vh 0;gap:2vw}
.stagew{flex:1.8;align-self:stretch;margin:0;padding-right:4vw}
.bot{flex:1;min-width:310px;max-width:460px;align-self:center;margin:0;padding:0}
.ctl{justify-content:flex-start;gap:14px;margin:3vh 0 0}}
</style></head>
